"register_backend" = "mdb_lanes.backends:register_backend"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdb_lanes"]
# Package data carried with src/mdb_lanes: mdb_lanes/assets/computation_viewer.html

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
