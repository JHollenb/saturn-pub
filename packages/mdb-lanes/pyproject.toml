[project]
name = "mdb-lanes"
version = "0.1.0"
description = "Experiment-specific lane modules split from the mdb engine."
requires-python = ">=3.10"
dependencies = ["mdb-runtime"]

[project.optional-dependencies]
all = ["mdb-runtime[all]"]
autoregressive = ["mdb-runtime[autoregressive]"]
dev = ["mdb-runtime[dev]"]
diffusion = ["mdb-runtime[diffusion]"]
discovery = ["mdb-runtime[discovery]"]
mrun = ["mdb-runtime[mrun]"]
serve = ["mdb-runtime[serve]"]
transformerlens = ["mdb-runtime[transformerlens]"]

[project.entry-points."mdb.lanes"]
"analyze" = "mdb_lanes.lanes_compat:main"
"atlas" = "mdb_lanes.lanes_compat:main"
"attach" = "mdb_lanes.lanes_compat:main"
"bench" = "mdb_lanes.lanes_compat:main"
"bisect" = "mdb_lanes.lanes_compat:main"
"cache" = "mdb_lanes.lanes_compat:main"
"capabilities" = "mdb_lanes.lanes_compat:main"
"circuits" = "mdb_lanes.lanes_compat:main"
"cite" = "mdb_lanes.lanes_compat:main"
"claims" = "mdb_lanes.lanes_compat:main"
"compiled-state" = "mdb_lanes.lanes_compat:main"
"context" = "mdb_lanes.lanes_compat:main"
"custody" = "mdb_lanes.lanes_compat:main"
"debug" = "mdb_lanes.lanes_compat:main"
"discovery" = "mdb_lanes.lanes_compat:main"
"doctor" = "mdb_lanes.lanes_compat:main"
"edit-search" = "mdb_lanes.lanes_compat:main"
"equations" = "mdb_lanes.lanes_compat:main"
"evidence" = "mdb_lanes.lanes_compat:main"
"family" = "mdb_lanes.lanes_compat:main"
"forecast" = "mdb_lanes.lanes_compat:main"
"forward-symbols" = "mdb_lanes.lanes_compat:main"
"graph" = "mdb_lanes.lanes_compat:main"
"help" = "mdb_lanes.lanes_compat:main"
"hyperion" = "mdb_lanes.lanes_compat:main"
"inspect" = "mdb_lanes.lanes_compat:main"
"jobs" = "mdb_lanes.lanes_compat:main"
"open" = "mdb_lanes.lanes_compat:main"
"ports" = "mdb_lanes.lanes_compat:main"
"project" = "mdb_lanes.lanes_compat:main"
"public" = "mdb_lanes.lanes_compat:main"
"replay" = "mdb_lanes.lanes_compat:main"
"resume" = "mdb_lanes.lanes_compat:main"
"run" = "mdb_lanes.lanes_compat:main"
"script" = "mdb_lanes.lanes_compat:main"
"states" = "mdb_lanes.lanes_compat:main"
"storage" = "mdb_lanes.lanes_compat:main"
"symbol-producers" = "mdb_lanes.lanes_compat:main"
"symbol-trace" = "mdb_lanes.lanes_compat:main"
"symbols" = "mdb_lanes.lanes_compat:main"
"verify" = "mdb_lanes.lanes_compat:main"
"view" = "mdb_lanes.lanes_compat:main"
"vm" = "mdb_lanes.lanes_compat:main"
"watch" = "mdb_lanes.lanes_compat:main"
"wsp" = "mdb_lanes.lanes_compat:main"
