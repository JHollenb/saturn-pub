[project]
name = "mdb-runtime"
version = "0.2.2"
description = "A gdb-style debugger for language models: step native decoder layers port by port, edit, checkpoint, rewind, and capture ports passively."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["saturn-pub>=0.4.2,<0.5", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
discovery = ["torch==2.13.0", "numpy>=2.0", "safetensors>=0.5"]
mrun = ["mrun-pub @ git+https://github.com/JHollenb/mrun-pub.git@3a8ec7ef6f2678a889c0b1415cbf32efca8b8561"]
autoregressive = ["torch==2.13.0", "numpy>=2.0", "safetensors>=0.5", "transformers==5.14.1", "accelerate==1.14.0"]
transformerlens = ["mdb-runtime[autoregressive]", "transformer-lens==4.2.0"]
interop = ["transformer-lens==4.4.0", "nnsight==0.8.2"]
diffusion = ["mrun-pub @ git+https://github.com/JHollenb/mrun-pub.git@3a8ec7ef6f2678a889c0b1415cbf32efca8b8561", "torch==2.13.0", "numpy>=2.0", "safetensors>=0.5", "transformers==5.14.1", "accelerate==1.14.0", "diffusers==0.39.0", "pillow>=10.0"]
all = ["mrun-pub @ git+https://github.com/JHollenb/mrun-pub.git@3a8ec7ef6f2678a889c0b1415cbf32efca8b8561", "torch==2.13.0", "numpy>=2.0", "safetensors>=0.5", "transformers==5.14.1", "accelerate==1.14.0", "diffusers==0.39.0", "pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "hatchling>=1.25", "tomli>=2; python_version < '3.11'"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "websockets>=12", "numpy>=2.0"]

[project.scripts]
mdb = "mdb.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdb"]
# The built web app (gitignored; run `npm run build` in web/ BEFORE `python -m build`/`uv build`:
# hatch only packs files that exist, so a wheel built without it serves the API but answers
# `/` with Refused web_build_absent).
artifacts = ["src/mdb/serve/static/**"]

[tool.hatch.build.targets.sdist]
# Only what a user needs to build, test and learn the package. Internal experiments, results,
# trackers and lane-era docs live in ../mdb-experiments and are never packed.
include = [
  "src/mdb/**",
  "tests/**",
  "docs/**",
  "examples/**",
  "web/**",
  "README.md",
  "CHANGELOG.md",
  "pyproject.toml",
]
exclude = ["web/node_modules/**", "web/dist/**", "**/__pycache__/**"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I"]
