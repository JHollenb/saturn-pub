[project]
name = "mdb-runtime"
version = "0.1.0"
description = "Standalone typed model virtual memory, reversible sessions and model debugger."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["saturn-pub>=0.4.0,<0.5"]

[project.optional-dependencies]
mrun = ["mrun-pub @ git+https://github.com/JHollenb/mrun-pub.git@3a8ec7ef6f2678a889c0b1415cbf32efca8b8561"]
autoregressive = ["torch==2.13.0", "numpy>=2.0", "safetensors>=0.5", "transformers==5.14.1", "accelerate==1.14.0"]
transformerlens = ["mdb-runtime[autoregressive]", "transformer-lens==4.2.0"]
diffusion = ["mrun-pub @ git+https://github.com/JHollenb/mrun-pub.git@3a8ec7ef6f2678a889c0b1415cbf32efca8b8561", "torch==2.13.0", "numpy>=2.0", "safetensors>=0.5", "transformers==5.14.1", "accelerate==1.14.0", "diffusers==0.39.0", "pillow>=10.0"]
all = ["mrun-pub @ git+https://github.com/JHollenb/mrun-pub.git@3a8ec7ef6f2678a889c0b1415cbf32efca8b8561", "torch==2.13.0", "numpy>=2.0", "safetensors>=0.5", "transformers==5.14.1", "accelerate==1.14.0", "diffusers==0.39.0", "pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "hatchling>=1.25"]

[project.scripts]
mdb = "mdb.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdb"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["experiments/time_circuits/vendor"] # Frozen paper source bytes.

[tool.ruff.lint]
select = ["F", "I"]
