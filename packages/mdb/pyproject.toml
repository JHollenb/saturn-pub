[project]
name = "mdb-runtime"
version = "0.1.0"
description = "Standalone typed model virtual memory, reversible sessions and model debugger."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mrun = ["mrun @ git+ssh://git@github.com/JHollenb/mrun.git@f002ce776e14143114e232ed6af872808a3de160", "manalysis @ git+ssh://git@github.com/JHollenb/manalysis.git@2ea2eedca427a59b742cf2d2c5249183ece3ef01"]
autoregressive = ["torch==2.13.0", "numpy>=2.0", "safetensors>=0.5", "transformers==5.14.1", "accelerate==1.14.0"]
diffusion = ["mrun @ git+ssh://git@github.com/JHollenb/mrun.git@f002ce776e14143114e232ed6af872808a3de160", "manalysis @ git+ssh://git@github.com/JHollenb/manalysis.git@2ea2eedca427a59b742cf2d2c5249183ece3ef01", "torch==2.13.0", "numpy>=2.0", "safetensors>=0.5", "transformers==5.14.1", "accelerate==1.14.0", "diffusers==0.39.0", "pillow>=10.0"]
all = ["mrun @ git+ssh://git@github.com/JHollenb/mrun.git@f002ce776e14143114e232ed6af872808a3de160", "manalysis @ git+ssh://git@github.com/JHollenb/manalysis.git@2ea2eedca427a59b742cf2d2c5249183ece3ef01", "torch==2.13.0", "numpy>=2.0", "safetensors>=0.5", "transformers==5.14.1", "accelerate==1.14.0", "diffusers==0.39.0", "pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "hatchling>=1.25"]

[project.scripts]
mdb = "mdb.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdb"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I"]
