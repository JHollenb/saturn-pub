[project]
name = "saturn-pub"
version = "0.2.0"
description = "Inspect, branch, intervene, replay, and train native models as software."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Jake Holl"}]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.8,<3", "numpy>=2,<3", "safetensors>=0.5,<1"]
ar = ["saturn-pub[torch]", "transformers==5.14.1"]
diffusion = ["saturn-pub[torch]", "diffusers==0.39.0", "transformers==5.14.1", "accelerate>=1.14,<2", "Pillow>=10"]
train = ["saturn-pub[torch]"]
interop = ["saturn-pub[ar]", "sae-lens==6.51.3", "transformer-lens==3.9.0"]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1.2"]
notebooks = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
saturn-pub = "saturn_pub.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saturn_pub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
